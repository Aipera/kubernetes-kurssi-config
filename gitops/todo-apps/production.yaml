# production-release.json pins a configuration commit and the three code images.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-project
  namespace: argocd
  labels:
    environment: production
spec:
  project: default
  source:
    repoURL: https://github.com/Aipera/kubernetes-kurssi-config.git
    targetRevision: CONFIG_INITIAL_COMMIT
    path: overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: project
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - FailOnSharedResource=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
